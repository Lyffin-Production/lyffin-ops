  // ── FOLLOW-UPS TAB (tasks + client communication log) ──────────────────────
  let _taskOwnerOptionsCache = null;

  async function loadTaskOwnerOptions() {
    if (_taskOwnerOptionsCache) return _taskOwnerOptionsCache;
    try {
      const snap = await getDocs(collection(db, 'users'));
      const users = snap.docs.map(d => d.data()).filter(u => u.name);
      _taskOwnerOptionsCache = users.map(u =>
        '<label class="task-owner-chk"><input type="checkbox" value="' + esc(u.name) + '"> ' + esc(u.name) + '</label>'
      ).join('');
    } catch (e) { _taskOwnerOptionsCache = ''; }
    return _taskOwnerOptionsCache;
  }

  async function loadFollowups() {
    const el = document.getElementById('tab-content');
    try {
      const [taskSnap, logSnap, ownerOpts] = await Promise.all([
        getDocs(query(collection(db, 'tasks'), where('projectId', '==', projectId))),
        getDocs(query(collection(db, 'commLogs'), where('projectId', '==', projectId))),
        loadTaskOwnerOptions()
      ]);
      const tasks = taskSnap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      const logs = logSnap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      el.innerHTML = renderFollowupsContent(tasks, logs, ownerOpts);
    } catch (e) {
      el.innerHTML = '<div class="section-card"><div class="empty-small">Couldn\'t load follow-ups: ' + esc(e.message) + '</div></div>';
    }
  }

  function renderFollowupsContent(tasks, logs, ownerOpts) {
    const today = new Date().toISOString().slice(0,10);
    // Open tasks first (earliest due date first, undated last), then done ones.
    const sorted = tasks.slice().sort((a, b) => {
      if ((a.status === 'done') !== (b.status === 'done')) return a.status === 'done' ? 1 : -1;
      const da = a.dueDate || '9999-99-99', db_ = b.dueDate || '9999-99-99';
      return da < db_ ? -1 : da > db_ ? 1 : 0;
    });
    const taskRows = sorted.length ? sorted.map(t => {
      const overdue = t.status !== 'done' && t.dueDate && t.dueDate < today;
      const done = t.status === 'done';
      const owners = (t.ownerNames && t.ownerNames.length) ? t.ownerNames.map(esc).join(', ') : (t.ownerName ? esc(t.ownerName) : 'Unassigned');
      return '<div class="task-row' + (done ? ' task-done' : '') + '">' +
        '<label class="task-check"><input type="checkbox" ' + (done ? 'checked' : '') + ' onchange="toggleTask(\'' + t.id + '\', this.checked)"><span></span></label>' +
        '<div class="task-body">' +
          '<div class="task-text">' + esc(t.text || '') + '</div>' +
          '<div class="task-meta">' +
            owners +
            (t.dueDate ? ' · due ' + formatDate(t.dueDate) : '') +
            (overdue ? ' <span class="task-overdue">OVERDUE</span>' : '') +
          '</div>' +
        '</div>' +
        '<button class="task-del" onclick="deleteTask(\'' + t.id + '\')" title="Delete">✕</button>' +
      '</div>';
    }).join('') : '<div class="empty-small">No tasks yet — add one below.</div>';

    const sortedLogs = logs.slice().sort((a, b) => (b.at?.seconds || 0) - (a.at?.seconds || 0));
    const logRows = sortedLogs.length ? sortedLogs.map(l => {
      const when = l.at && l.at.seconds ? new Date(l.at.seconds * 1000).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      return '<div class="log-row">' +
        '<div class="log-head"><span class="log-channel">' + esc(l.channel || 'Note') + '</span><span class="log-when">' + esc(when) + ' · ' + esc(l.loggedBy || '') + '</span></div>' +
        '<div class="log-summary">' + esc(l.summary || '') + '</div>' +
      '</div>';
    }).join('') : '<div class="empty-small">No communication logged yet.</div>';

    return `
      <div class="section-card" style="margin-bottom:16px">
        <div class="section-header"><div class="section-title">Tasks</div></div>
        <div id="task-list">${taskRows}</div>
        <div class="task-add-form">
          <input type="text" id="new-task-text" placeholder="What needs to happen?">
          <div class="task-owner-picker" id="new-task-owners">${ownerOpts}</div>
          <input type="date" id="new-task-due">
          <button class="btn btn-primary" onclick="addTask()">Add task</button>
        </div>
      </div>

      <div class="section-card">
        <div class="section-header"><div class="section-title">Client communication log</div></div>
        <div id="log-list">${logRows}</div>
        <div class="log-add-form">
          <select id="new-log-channel">
            <option value="Call">Call</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Email">Email</option>
            <option value="In person">In person</option>
            <option value="Other">Other</option>
          </select>
          <textarea id="new-log-summary" placeholder="What was discussed or promised?"></textarea>
          <button class="btn btn-primary" onclick="addCommLog()">Log entry</button>
        </div>
      </div>`;
  }

  window.addTask = async function() {
    const textEl = document.getElementById('new-task-text');
    const dueEl = document.getElementById('new-task-due');
    const text = textEl.value.trim();
    if (!text) { showToast('Enter what needs to happen'); return; }
    const ownerNames = Array.from(document.querySelectorAll('#new-task-owners input:checked')).map(c => c.value);
    const dueDate = dueEl.value;
    try {
      await addDoc(collection(db, 'tasks'), {
        projectId, projectName: project.projectName || '',
        text, ownerNames, dueDate: dueDate || '',
        status: 'open', seenBy: [],
        createdBy: document.getElementById('user-name').textContent,
        createdAt: serverTimestamp()
      });
      await logProjectActivity((document.getElementById('user-name').textContent) + ' added a task: ' + text +
        (ownerNames.length ? ' (assigned to ' + ownerNames.join(', ') + ')' : ''));
      loadFollowups();
    } catch (e) {
      showToast('Save failed: ' + e.message);
    }
  };

  window.toggleTask = async function(taskId, checked) {
    try {
      await updateDoc(doc(db, 'tasks', taskId), {
        status: checked ? 'done' : 'open',
        completedAt: checked ? serverTimestamp() : null,
        completedBy: checked ? document.getElementById('user-name').textContent : null
      });
      loadFollowups();
    } catch (e) {
      showToast('Update failed: ' + e.message);
      loadFollowups();
    }
  };

  window.deleteTask = async function(taskId) {
    if (!confirm('Delete this task?')) return;
    try {
      await deleteDoc(doc(db, 'tasks', taskId));
      loadFollowups();
    } catch (e) { showToast('Delete failed: ' + e.message); }
  };

  window.addCommLog = async function() {
    const channelEl = document.getElementById('new-log-channel');
    const summaryEl = document.getElementById('new-log-summary');
    const summary = summaryEl.value.trim();
    if (!summary) { showToast('Enter what was discussed'); return; }
    try {
      await addDoc(collection(db, 'commLogs'), {
        projectId, projectName: project.projectName || '',
        channel: channelEl.value, summary,
        loggedBy: document.getElementById('user-name').textContent,
        loggedByUid: currentUser ? currentUser.uid : '',
        at: serverTimestamp()
      });
      loadFollowups();
    } catch (e) {
      showToast('Save failed: ' + e.message);
    }
  };

  window.saveNotes = async function() {
    const notes = document.getElementById('notes-input').value.trim();
    try {
      await updateDoc(doc(db, 'projects', projectId), { notes, updatedAt: serverTimestamp() });
      project.notes = notes;
      showToast('Notes saved');
    } catch(e) { showToast('Error: ' + e.message); }
  };

  // ── HELPERS ───────────────────────────────────────────────────────────────
  window.openDeliveryModal = function() {
    document.getElementById('d-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('d-by').value = document.getElementById('user-name').textContent;
    document.getElementById('modal-delivery').classList.add('open');
    // Reset checklist
    ['chk1','chk2','chk3','chk4','chk5'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.checked = false;
    });
    const warn = document.getElementById('checklist-warning');
    if (warn) warn.style.display = 'none';
  };

  window.confirmDelivery = async function() {
    const btn = document.getElementById('btn-confirm-delivery');
    const deliveryDate = document.getElementById('d-date').value;
    const deliveredBy  = document.getElementById('d-by').value.trim();
    const notes        = document.getElementById('d-notes').value.trim();
    const status       = document.getElementById('d-status').value;
    if (!deliveryDate) { showToast('Please enter delivery date'); return; }
    const allChecked = ['chk1','chk2','chk3','chk4','chk5'].every(id => {
      const el = document.getElementById(id);
      return el && el.checked;
    });
    if (!allChecked) {
      const warn = document.getElementById('checklist-warning');
      if (warn) warn.style.display = 'block';
      showToast('Please complete the delivery checklist');
      return;
    }
    const unfinished = activeItems().filter(i => i.overallStatus !== 'Ready');
    if (unfinished.length) {
      alert('Can\'t confirm delivery — ' + unfinished.length + ' item(s) are not yet Ready:\n' +
        unfinished.slice(0, 8).map(i => '• ' + (i.name || 'item') + (i.onHold ? '  [ON HOLD' + (i.holdReason ? ': ' + i.holdReason : '') + ']' : '')).join('\n') +
        (unfinished.length > 8 ? '\n…and ' + (unfinished.length - 8) + ' more' : '') +
        '\n\nUpdate them in Factory first.');
      return;
    }
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
      await updateDoc(doc(db, 'projects', projectId), {
        status,
        deliveryStatus:  'Completed',
        deliveredDate:   deliveryDate,
        deliveredBy,
        deliveryNotes:   notes,
        updatedAt:       serverTimestamp(),
      });
      await logProjectActivity(deliveredBy + ' marked project as ' + status + ' on ' + deliveryDate + (notes ? ' · Notes: ' + notes : ''));
      await syncPublicShare(projectId);
      Object.assign(project, { status, deliveredDate: deliveryDate, deliveredBy, deliveryNotes: notes });
      closeModal('modal-delivery');
      showToast('Project marked as ' + status);
      renderContent();
    } catch(e) {
      showToast('Save failed: ' + e.message);
      alert('The save did not go through:\n\n' + e.message + '\n\nPlease try again.');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Confirm delivery'; }
    }
  };

  // Once a project is already Delivered, moving to Completed doesn't need
  // the date/delivered-by/notes/checklist re-entered — that was all
  // captured when it was first marked delivered. This is deliberately just
  // a confirm() and a status flip, not a form.
  window.markCompleted = async function() {
    if (project.status !== 'Delivered') return;
    if (!confirm('Mark "' + (project.projectName||'this project') + '" as Completed — fully signed off?')) return;
    try {
      await updateDoc(doc(db, 'projects', projectId), {
        status: 'Completed',
        updatedAt: serverTimestamp(),
      });
      await logProjectActivity(document.getElementById('user-name').textContent + ' marked project as Completed');
      await syncPublicShare(projectId);
      project.status = 'Completed';
      showToast('Project marked as Completed');
      renderContent();
    } catch(e) {
      showToast('Save failed: ' + e.message);
    }
  };

  // Tracks whether a specific item has physically left the factory —
  // independent of the project's own status, so a partial shipment (some
  // items delivered now, the rest once they're ready) can be recorded
  // without needing the whole project to move to Delivered.
  window.toggleItemDelivered = async function(itemId, checked) {
    try {
      await updateDoc(doc(db, 'projects', projectId, 'items', itemId), {
        delivered: checked,
        deliveredAt: checked ? serverTimestamp() : null
      });
      const it = items.find(i => i.id === itemId);
      if (it) it.delivered = checked;
      renderTab('items');
    } catch(e) {
      showToast('Save failed: ' + e.message);
    }
  };

  // The common case — everything goes out together — shouldn't require
  // touching each item individually. One click marks every active item
  // delivered at once.
  window.markAllItemsDelivered = async function() {
    const undelivered = activeItems().filter(i => !i.delivered);
    if (!undelivered.length) return;
    if (!confirm('Mark all ' + undelivered.length + ' remaining item(s) as delivered?')) return;
    try {
      await Promise.all(undelivered.map(it =>
        updateDoc(doc(db, 'projects', projectId, 'items', it.id), { delivered: true, deliveredAt: serverTimestamp() })
      ));
      undelivered.forEach(it => { it.delivered = true; });
      showToast('All items marked delivered');
      renderTab('items');
    } catch(e) {
      showToast('Save failed: ' + e.message);
    }
  };

  window.deleteProject = async function() {
    if (!confirm('Delete ' + (project.projectName||'this project') + '? This permanently deletes the project, its production items, and every complaint/QC record logged against it. This cannot be undone.')) return;
    try {
      // Delete all items in subcollection first
      const itemsSnap = await getDocs(collection(db, 'projects', projectId, 'items')); itemsSnap.docs.sort((a,b)=>{ const na=parseInt(a.data().productNo)||0,nb=parseInt(b.data().productNo)||0; return na!==nb?na-nb:(a.data().name||'').localeCompare(b.data().name||''); });
      const batch = [];
      itemsSnap.docs.forEach(d => {
        batch.push(deleteDoc(doc(db, 'projects', projectId, 'items', d.id)));
      });
      // Also clean up the activity and handover-date-history subcollections,
      // the public share mirror, and the complaints/QC records that
      // reference this project by ID — otherwise all of these are orphaned
      // records that outlive the project they belonged to.
      const [activitySnap, historySnap, complaintsSnap, qcSnap] = await Promise.all([
        getDocs(collection(db, 'projects', projectId, 'activity')),
        getDocs(collection(db, 'projects', projectId, 'dateHistory')),
        getDocs(query(collection(db, 'complaints'), where('projectId', '==', projectId))),
        getDocs(query(collection(db, 'qc_reports'), where('projectId', '==', projectId))),
      ]);
      activitySnap.docs.forEach(d => batch.push(deleteDoc(doc(db, 'projects', projectId, 'activity', d.id))));
      historySnap.docs.forEach(d => batch.push(deleteDoc(doc(db, 'projects', projectId, 'dateHistory', d.id))));
      complaintsSnap.docs.forEach(d => batch.push(deleteDoc(doc(db, 'complaints', d.id))));
      qcSnap.docs.forEach(d => batch.push(deleteDoc(doc(db, 'qc_reports', d.id))));
      // publicShares is keyed by share TOKEN, not project ID — look up the
      // current token via shareTokens before we can find the right doc.
      const tokSnap = await getDoc(doc(db, 'shareTokens', projectId));
      if (tokSnap.exists() && tokSnap.data().token) {
        const shareToken = tokSnap.data().token;
        // Items live in a subcollection under the token now (for the
        // thumbnail feature) — clean those up too, or they'd be orphaned.
        const shareItemsSnap = await getDocs(collection(db, 'publicShares', shareToken, 'items')).catch(() => null);
        if (shareItemsSnap) shareItemsSnap.docs.forEach(d => batch.push(deleteDoc(doc(db, 'publicShares', shareToken, 'items', d.id)).catch(() => {})));
        batch.push(deleteDoc(doc(db, 'publicShares', shareToken)).catch(() => {}));
      }
      batch.push(deleteDoc(doc(db, 'shareTokens', projectId)).catch(() => {}));
      await Promise.all(batch);
      // Delete the project
      await deleteDoc(doc(db, 'projects', projectId));
      showToast('Project deleted');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    } catch(e) {
      showToast('Delete failed: ' + e.message);
      alert('The delete did not complete:\n\n' + e.message + '\n\nSome records may have been removed and others not — please check before retrying.');
    }
  };

  window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };

  window.copyShareLink = async function() {
    const token = await getOrCreateShareToken(projectId);
    await syncPublicShare(projectId); // ensure the public data exists and is current
    // Resolve relative to THIS page's own URL, not the domain root — this
    // way the link is correct whether the app is served at a domain root
    // (ops.lyffin.com/) or in a subfolder (e.g. .../lyffin-ops/), without
    // needing to know or care which.
    const url = new URL('share.html?t=' + token, window.location.href).href;
    navigator.clipboard.writeText(url).then(function() {
      showToast('Share link copied — send to client');
    }).catch(function() {
      prompt('Copy this link and send to your client:', url);
    });
  };

  // Invalidates the current share link immediately (old URL stops working)
  // and hands out a fresh one — for when a link was sent to the wrong
  // person, or you just want a clean rotation.
  window.revokeShareLink = async function() {
    if (!confirm('Revoke the current share link? Anyone with the old link will immediately lose access, and a new link will be generated.')) return;
    try {
      const tokSnap = await getDoc(doc(db, 'shareTokens', projectId));
      if (tokSnap.exists() && tokSnap.data().token) {
        await updateDoc(doc(db, 'publicShares', tokSnap.data().token), { active: false }).catch(() => {});
      }
      await deleteDoc(doc(db, 'shareTokens', projectId)).catch(() => {});
      const newToken = await getOrCreateShareToken(projectId);
      await syncPublicShare(projectId);
      const url = new URL('share.html?t=' + newToken, window.location.href).href;
      navigator.clipboard.writeText(url).then(function() {
        showToast('Old link revoked — new link copied');
      }).catch(function() {
        prompt('Old link revoked. Copy the new link for your client:', url);
      });
    } catch (e) {
      showToast('Revoke failed: ' + e.message);
    }
  };

  window.signOut = async function() { await fbSignOut(auth); window.location.href = 'login.html'; };

  function formatDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }

  // ── ACTIVITY LOG ──────────────────────────────────────────────────────────
  // Generates a random, unguessable share token (32 hex-ish chars).
  function generateShareToken() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
    let s = '';
    for (let i = 0; i < 32; i++) s += Math.floor(Math.random() * 36).toString(36);
    return s;
  }

  // Days a share link stays valid before it needs regenerating.
  const SHARE_LINK_DAYS = 90;

  // Returns the project's current active share token, creating one (and the
  // shareTokens/{projectId} bookkeeping doc) if none exists yet. Doesn't
  // create a publicShares doc by itself — syncPublicShare does that.
  async function getOrCreateShareToken(projectId) {
    const tokSnap = await getDoc(doc(db, 'shareTokens', projectId));
    if (tokSnap.exists() && tokSnap.data().token) return tokSnap.data().token;
    const token = generateShareToken();
    await setDoc(doc(db, 'shareTokens', projectId), { token, createdAt: serverTimestamp() });
    return token;
  }

  // Mirrors only the safe, customer-facing fields into publicShares/{token}
  // — the no-login share page reads only from there, never the real
  // projects/items collections. Does nothing if no share link has ever been
  // generated for this project (no point creating public data nobody has a
  // link to yet). Called after any write that could change what a client
  // sees, plus once explicitly whenever a share link is copied.
  async function syncPublicShare(projectId) {
    try {
      const tokSnap = await getDoc(doc(db, 'shareTokens', projectId));
      if (!tokSnap.exists() || !tokSnap.data().token) return;
      const token = tokSnap.data().token;

      const pSnap = await getDoc(doc(db, 'projects', projectId));
      if (!pSnap.exists()) return;
      const p = pSnap.data();
      const itemsSnap = await getDocs(collection(db, 'projects', projectId, 'items'));

      // Preserve the original expiry instead of pushing it out every time
      // status changes — a link should expire on schedule, not just because
      // the project stayed active.
      const existing = await getDoc(doc(db, 'publicShares', token));
      const expiresAt = existing.exists() && existing.data().expiresAt
        ? existing.data().expiresAt
        : new Date(Date.now() + SHARE_LINK_DAYS * 86400000);

      await setDoc(doc(db, 'publicShares', token), {
        projectName: p.projectName || '', location: p.location || '', orderNo: p.orderNo || '',
        status: p.status || 'Not Started', handoverDate: p.handoverDate || '',
        active: true, expiresAt, updatedAt: serverTimestamp()
      });

      // Each item is its own small document (including its thumbnail, if
      // any) rather than one big array — see the comment in firestore.rules
      // for why. Mirror the current set exactly: write/update every real,
      // non-removed item, then remove any mirrored item that's no longer
      // current — either genuinely deleted, or flagged `removed` after
      // being dropped in a later revision (clients shouldn't see a product
      // that's no longer actually part of their order).
      const currentIds = new Set();
      for (const d of itemsSnap.docs) {
        const it = d.data();
        if (it.removed) continue;
        currentIds.add(d.id);
        await setDoc(doc(db, 'publicShares', token, 'items', d.id), {
          name: it.name || '', productNo: it.productNo || '', qty: it.qty || 1,
          area: it.area || '', dimensions: it.dimensions || '',
          thumbnail: it.thumbnail || null,
          onHold: !!it.onHold, holdReason: it.holdReason || '',
          overallStatus: it.overallStatus || 'Structure',
          carpentryStatus: it.carpentryStatus || 'pending',
          polishStatus: it.polishStatus || 'pending',
          upholsteryStatus: it.upholsteryStatus || 'pending',
          packingStatus: it.packingStatus || 'pending'
        });
      }
      const mirroredSnap = await getDocs(collection(db, 'publicShares', token, 'items'));
      for (const d of mirroredSnap.docs) {
        if (!currentIds.has(d.id)) await deleteDoc(doc(db, 'publicShares', token, 'items', d.id));
      }
    } catch (e) { console.error('publicShare sync failed', e); }
  }

  async function logProjectActivity(message) {
    try {
      await addDoc(collection(db, 'projects', projectId, 'activity'), {
        message,
        by: document.getElementById('user-name').textContent,
        uid: currentUser ? currentUser.uid : '',
        at: serverTimestamp()
      });
    } catch(e) {
      console.error('Activity log write failed:', e.message);
      // The main save already succeeded by the time this runs — this is a
      // secondary write, so a quiet toast is enough; it shouldn't block or
      // alarm the user, but they should still know the audit trail may be
      // incomplete for this change.
      showToast('Saved, but the activity log entry failed — audit trail may be incomplete');
    }
  }

  async function loadActivityLog() {
    const listEl = document.getElementById('activity-list');
    if (!listEl) return;
    try {
      const snap = await getDocs(query(collection(db, 'projects', projectId, 'activity'), orderBy('at', 'desc')));
      if (snap.empty) {
        listEl.innerHTML = '<div class="empty-small">No activity recorded yet.</div>';
        return;
      }
      listEl.innerHTML = snap.docs.map(function(d) {
        const a = d.data();
        const dt = a.at && a.at.toDate ? a.at.toDate() : (a.at ? new Date(a.at) : null);
        const dtStr = dt ? dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : '—';
        return '<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-bottom:1px solid var(--surface-2)">' +
          '<div style="width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:5px"></div>' +
          '<div style="flex:1">' +
            '<div style="font-size:13px;color:var(--ink)">' + esc(a.message||'—') + '</div>' +
            '<div style="font-size:11px;color:var(--ink-3);margin-top:2px">' + dtStr + '</div>' +
          '</div>' +
        '</div>';
      }).join('') +
      // Also show handover date history
      await (async function() {
        try {
            const hSnap = await getDocs(query(collection(db, 'projects', projectId, 'dateHistory'), orderBy('changedAt', 'desc')));
          if (hSnap.empty) return '';
          return '<div style="padding:14px 20px;border-top:1px solid var(--border);background:var(--surface)">' +
            '<div style="font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Handover date changes</div>' +
            hSnap.docs.map(function(d) {
              const h = d.data();
              const dt2 = h.changedAt && h.changedAt.toDate ? h.changedAt.toDate() : null;
              return '<div style="font-size:12px;color:var(--ink-2);margin-bottom:6px">' +
                esc(h.changedBy||'—') + ' changed handover from <strong>' + esc(h.oldDate||'none') + '</strong> to <strong>' + esc(h.newDate||'—') + '</strong>' +
                (dt2 ? ' <span style="color:var(--ink-3)">· ' + dt2.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + '</span>' : '') +
              '</div>';
            }).join('') +
          '</div>';
        } catch(e) { return ''; }
      })();
    } catch(e) {
      listEl.innerHTML = '<div class="empty-small">Error loading activity.</div>';
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
