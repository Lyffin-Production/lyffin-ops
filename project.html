<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lyffin Ops">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lyffin Ops — Project</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:       #1a1a18;
    --ink-2:     #4a4a46;
    --ink-3:     #9a9890;
    --surface:   #f7f6f2;
    --surface-2: #eeecea;
    --border:    #dddbd5;
    --gold:      #b89a6a;
    --gold-lt:   rgba(184,154,106,0.12);
    --white:     #ffffff;
    --radius:    6px;
    --sidebar-w: 220px;
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-disp: 'Playfair Display', Georgia, serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;600&display=swap');

  body { font-family: var(--font-sans); background: var(--surface); color: var(--ink); min-height: 100vh; display: flex; }

  /* SIDEBAR */
  .sidebar { width: var(--sidebar-w); min-height: 100vh; background: var(--ink); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; left: 0; top: 0; bottom: 0; }
  .sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .sidebar-logo-name { font-family: var(--font-disp); font-size: 18px; font-weight: 600; color: var(--white); }
  .sidebar-logo-sub { font-size: 10px; color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-section { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.25); letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 10px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 5px; font-size: 13.5px; color: rgba(255,255,255,0.55); cursor: pointer; text-decoration: none; transition: background 0.12s, color 0.12s; }
  .nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
  .nav-item.active { background: rgba(184,154,106,0.18); color: var(--gold); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .sidebar-user { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(184,154,106,0.25); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--gold); flex-shrink: 0; }
  .user-name { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.8); }
  .user-role { font-size: 11px; color: rgba(255,255,255,0.3); text-transform: capitalize; }
  .btn-signout { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.25); padding: 4px; border-radius: 4px; display: flex; align-items: center; transition: color 0.12s; margin-left: auto; }
  .btn-signout:hover { color: rgba(255,255,255,0.6); }
  .btn-signout svg { width: 15px; height: 15px; }

  /* MAIN */
  .main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }

  .topbar { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); cursor: pointer; text-decoration: none; transition: color 0.12s; }
  .back-btn:hover { color: var(--ink); }
  .back-btn svg { width: 14px; height: 14px; }
  .topbar-divider { width: 1px; height: 20px; background: var(--border); }
  .topbar-project-name { font-family: var(--font-disp); font-size: 17px; font-weight: 500; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }

  .btn { height: 36px; padding: 0 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; font-family: var(--font-sans); cursor: pointer; border: none; transition: all 0.12s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--ink); color: var(--white); }
  .btn-primary:hover { background: #2e2e2a; }
  .btn-ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { background: transparent; color: #c0392b; border: 1px solid #f5c6c6; }
  .btn-danger:hover { background: #fdf2f2; }
  .btn svg { width: 14px; height: 14px; }

  .content { padding: 28px 32px; flex: 1; display: flex; flex-direction: column; gap: 20px; }

  /* PROJECT HEADER CARD */
  .project-header-card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 24px 28px; }
  .project-header-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
  .project-title { font-family: var(--font-disp); font-size: 24px; font-weight: 500; margin-bottom: 4px; }
  .project-order { font-size: 13px; color: var(--ink-3); }
  .project-meta-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .meta-item label { font-size: 11px; font-weight: 500; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 4px; }
  .meta-item span { font-size: 14px; color: var(--ink); }

  /* STATUS BADGE */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .badge-structure   { background: #fef3cd; color: #92400e; } .badge-structure::before { background: #d97706; }
  .badge-polish      { background: #dbeafe; color: #1e40af; } .badge-polish::before { background: #3b82f6; }
  .badge-upholstery  { background: #e0f2fe; color: #075985; } .badge-upholstery::before { background: #0ea5e9; }
  .badge-packing     { background: #d1fae5; color: #065f46; } .badge-packing::before { background: #10b981; }
  .badge-delivered   { background: #dcfce7; color: #14532d; } .badge-delivered::before { background: #22c55e; }
  .badge-completed   { background: #f0fdf4; color: #166534; } .badge-completed::before { background: #16a34a; }
  .badge-not-started { background: #f3f4f6; color: #6b7280; } .badge-not-started::before { background: #9ca3af; }
  .badge-on-hold      { background: #f3f4f6; color: #6b7280; } .badge-on-hold::before { background: #9ca3af; }
  .badge-carpentry   { background: #fef3cd; color: #92400e; } .badge-carpentry::before { background: #d97706; }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 20px; font-size: 13.5px; font-weight: 500; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--gold); }

  /* SECTION CARD */
  .section-card { background: var(--white); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .section-header { padding: 14px 20px; border-bottom: 1px solid var(--surface-2); display: flex; align-items: center; justify-content: space-between; }
  .section-title { font-size: 14px; font-weight: 500; }

  /* ITEMS TABLE */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead tr { background: var(--surface); border-bottom: 1px solid var(--border); }
  th { padding: 9px 16px; text-align: left; font-size: 11px; font-weight: 500; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--surface-2); }
  tbody tr:last-child { border-bottom: none; }
  td { padding: 11px 16px; vertical-align: middle; }

  /* STAGE PILLS */
  .stage-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
  .sp-done { background: #dcfce7; color: #14532d; }
  .sp-done::before { content: '✓ '; }
  .sp-pending { background: #f3f4f6; color: #9ca3af; }
  .sp-na { background: transparent; color: #d1d5db; font-size: 10px; }

  /* EDIT FORM */
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 20px; }
  .form-field label { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 5px; }
  .form-field input, .form-field select, .form-field textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13.5px; font-family: var(--font-sans); color: var(--ink); background: var(--white); outline: none; transition: border-color 0.12s; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-lt); }
  .form-field.full { grid-column: 1 / -1; }

  /* COMPLAINTS IN PROJECT */
  .complaint-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--surface-2); }
  .complaint-row:last-child { border-bottom: none; }
  .complaint-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; flex-shrink: 0; margin-top: 5px; }
  .complaint-dot.resolved { background: #16a34a; }
  .complaint-body { flex: 1; }
  .complaint-product { font-size: 13px; font-weight: 500; }
  .complaint-details { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .complaint-meta { font-size: 11px; color: var(--ink-3); margin-top: 4px; }

  /* NOTES */
  .notes-area { padding: 16px 20px; }
  .notes-area textarea { width: 100%; min-height: 100px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13.5px; font-family: var(--font-sans); color: var(--ink); resize: vertical; outline: none; }
  .notes-area textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-lt); }
  .notes-save { margin-top: 10px; }

  /* FOLLOW-UPS: tasks */
  .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--surface-2); }
  .task-row:last-child { border-bottom: none; }
  .task-row.task-done .task-text { text-decoration: line-through; color: var(--ink-3); }
  .task-check { flex-shrink: 0; margin-top: 2px; cursor: pointer; }
  .task-check input { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; }
  .task-body { flex: 1; min-width: 0; }
  .task-text { font-size: 13.5px; color: var(--ink); }
  .task-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
  .task-overdue { color: #a83c2e; font-weight: 600; }
  .task-del { flex-shrink: 0; background: none; border: none; color: var(--ink-3); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  .task-del:hover { color: #a83c2e; }
  .task-add-form { display: flex; gap: 8px; padding: 14px 20px; flex-wrap: wrap; border-top: 1px solid var(--surface-2); }
  .task-add-form input[type="text"] { flex: 1; min-width: 160px; }
  .task-add-form input, .task-add-form select { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: var(--font-sans); color: var(--ink); background: var(--white); }
  .task-add-form select { max-width: 140px; }
  .task-add-form input[type="date"] { max-width: 140px; }
  .task-owner-picker { width: 100%; display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); max-height: 100px; overflow-y: auto; }
  .task-owner-chk { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .task-owner-chk input { width: 14px; height: 14px; cursor: pointer; margin: 0; }

  /* FOLLOW-UPS: communication log */
  .log-row { padding: 12px 20px; border-bottom: 1px solid var(--surface-2); }
  .log-row:last-child { border-bottom: none; }
  .log-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .log-channel { font-size: 11px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: .04em; }
  .log-when { font-size: 11px; color: var(--ink-3); }
  .log-summary { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; white-space: pre-line; }
  .log-add-form { padding: 14px 20px; border-top: 1px solid var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
  .log-add-form select { align-self: flex-start; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: var(--font-sans); color: var(--ink); background: var(--white); }
  .log-add-form textarea { width: 100%; min-height: 60px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13.5px; font-family: var(--font-sans); color: var(--ink); resize: vertical; outline: none; }
  .log-add-form textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-lt); }
  .log-add-form button { align-self: flex-start; }

  /* EMPTY */
  .empty-small { padding: 24px; text-align: center; font-size: 13px; color: var(--ink-3); }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: var(--radius); font-size: 13px; z-index: 200; transform: translateY(80px); opacity: 0; transition: all 0.25s ease; }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* LOADING */
  .page-loading { position: fixed; inset: 0; background: var(--surface); display: flex; align-items: center; justify-content: center; z-index: 999; }
  .spin-lg { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) { .project-meta-grid { grid-template-columns: repeat(3, 1fr); } }
  
    .project-meta-grid { grid-template-columns: repeat(2, 1fr); }
    .edit-grid { grid-template-columns: 1fr; }
  }

/* Mobile bottom nav */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--ink);
  height: 60px;
  z-index: 50;
  border-top: 1px solid rgba(255,255,255,0.07);
}
.bottom-nav-inner {
  display: flex;
  height: 100%;
}
.bn-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  text-decoration: none;
  color: rgba(255,255,255,0.4);
  font-size: 10px;
  font-weight: 500;
  font-family: var(--font-sans);
  transition: color .15s;
}
.bn-item.active { color: var(--gold); }
.bn-item svg { width: 20px; height: 20px; }

}

/* ── MOBILE APP STYLES ── */
@media (max-width: 700px) {
  body { font-size: 14px; }
  .topbar { padding: 0 16px; height: 52px; }
  .topbar-title { font-size: 16px; }
  .content { padding: 16px 12px 80px; }
  .stats-row { grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { padding: 14px 14px; }
  .stat-value { font-size: 22px; }
  .stat-label { font-size: 10px; }
  .table-wrap { border-radius: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { min-width: 500px; }
  .filters { gap: 8px; }
  .search-box { max-width: 100%; }
  .filter-select { font-size: 12px; height: 34px; }
  .btn { height: 38px; font-size: 12px; padding: 0 12px; }
  .project-card { border-radius: 8px; }
  .project-name { font-size: 14px; }
  .project-meta { font-size: 11px; }
  .progress-bar-bg { width: 80px; }
  .section-card { border-radius: 8px; }
  /* Production mobile */
  .items-table th, .items-table td { padding: 10px 12px; }
  .stages { gap: 4px; }
  .sp { padding: 5px 10px; font-size: 11px; }
  /* Make tap targets bigger */
  .sp, .btn, .nav-item, .tab { min-height: 40px; }
  /* Remove hover effects on touch */
  .sp:hover { transform: none; }
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--ink);
  height: 64px;
  z-index: 50;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav-inner { display: flex; height: 100%; align-items: stretch; width: 100%; justify-content: space-around; }
.bn-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; text-decoration: none;
  color: rgba(255,255,255,0.35); font-size: 9px; font-weight: 500;
  font-family: var(--font-sans); letter-spacing: 0.03em; text-transform: uppercase;
  cursor: pointer; border: none; background: none; transition: color .15s; padding: 0;
}
.bn-item.active { color: var(--gold); }
.bn-item svg { width: 22px; height: 22px; }
@media (max-width: 700px) {
  .sidebar { display: none !important; }
  .main { margin-left: 0 !important; }
  .content { padding-bottom: 80px !important; }
  .bottom-nav { display: flex; }
}
</style>
</head>
<body>

<div class="page-loading" id="page-loading"><div class="spin-lg"></div></div>

<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-name">lyffin</div>
    <div class="sidebar-logo-sub">Ops Platform</div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section">Workspace</div>
    <a class="nav-item active" href="dashboard.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
      Projects
    </a>
    <a class="nav-item" href="production.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 12V6l6-4 6 4v6"/><path d="M6 16v-5h4v5"/><path d="M2 12h12"/></svg>

    </a>
    <a class="nav-item" href="qc.html">

      Admin dashboard
    </a>
  </div>
  <div class="sidebar-user">
    <div class="user-avatar" id="user-avatar">?</div>
    <div>
      <div class="user-name" id="user-name">Loading…</div>
      <div class="user-role" id="user-role">—</div>

    </button>
  </div>
</nav>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <a class="back-btn" href="dashboard.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4L6 8l4 4"/></svg>
        Projects
      </a>
      <div class="topbar-divider"></div>
      <div class="topbar-project-name" id="topbar-name">Loading…</div>
    </div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </div>

  <div class="content" id="main-content">
    <div class="empty-small">Loading project…</div>
  </div>
</div>

<!-- Delivery Modal -->
<div class="modal-backdrop" id="modal-delivery">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Mark as delivered</div>
      <button class="modal-close" onclick="closeModal('modal-delivery')">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="2" x2="16" y2="16"/><line x1="16" y1="2" x2="2" y2="16"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-field">
          <label>Delivery date</label>
          <input type="date" id="d-date">
        </div>
        <div class="form-field">
          <label>Delivered by</label>
          <input type="text" id="d-by" placeholder="Name">
        </div>
      </div>
      <div class="form-field">
        <label>Delivery notes</label>
        <textarea id="d-notes" placeholder="Any notes about the delivery..." style="min-height:70px"></textarea>
      </div>
      <div class="form-field">
        <label>Final status</label>
        <select id="d-status">
          <option value="Delivered">Delivered — pending sign-off</option>
          <option value="Completed">Completed — fully signed off</option>
        </select>
      </div>
    </div>
      <div class="form-field" style="margin-top:4px">
        <label style="margin-bottom:8px;display:block">Delivery checklist</label>
        <div style="display:flex;flex-direction:column;gap:8px" id="delivery-checklist">
          <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-weight:400">
            <input type="checkbox" id="chk1" style="margin-top:2px;width:16px;height:16px;flex-shrink:0">
            <span style="font-size:13px">All items have been QC-checked and cleared</span>
          </label>
          <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-weight:400">
            <input type="checkbox" id="chk2" style="margin-top:2px;width:16px;height:16px;flex-shrink:0">
            <span style="font-size:13px">Factory listing documents ready</span>
          </label>
          <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-weight:400">
            <input type="checkbox" id="chk3" style="margin-top:2px;width:16px;height:16px;flex-shrink:0">
            <span style="font-size:13px">Client has been notified of delivery date</span>
          </label>
          <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-weight:400">
            <input type="checkbox" id="chk4" style="margin-top:2px;width:16px;height:16px;flex-shrink:0">
            <span style="font-size:13px">All items are packed and labelled</span>
          </label>
          <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-weight:400">
            <input type="checkbox" id="chk5" style="margin-top:2px;width:16px;height:16px;flex-shrink:0">
            <span style="font-size:13px">Delivery vehicle / logistics confirmed</span>
          </label>
        </div>
        <div id="checklist-warning" style="display:none;margin-top:8px;padding:8px 12px;background:#fef2f2;border-radius:6px;color:#c0392b;font-size:12px">Please confirm all checklist items before proceeding.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-delivery')">Cancel</button>
      <button class="btn btn-primary" id="btn-confirm-delivery" onclick="confirmDelivery()" style="background:#16a34a;border-color:#16a34a">Confirm delivery</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { onAuthStateChanged, signOut as fbSignOut } from 'https://www.gstatic.com/firebasejs/11.9.0/firebase-auth.js';
  import {
    doc, getDoc, updateDoc, deleteDoc, collection,
    getDocs, addDoc, query, where, serverTimestamp, orderBy, setDoc
  } from 'https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js';
  import { db, auth, esc, resolveUserDoc, initOfflineBanner, STATUS_ORDER, isValidTransition } from './shared.js';

  initOfflineBanner();

  // Get project ID from URL
  const params = new URLSearchParams(window.location.search);
  const projectId = params.get('id');
  if (!projectId) window.location.href = 'dashboard.html';

  let currentRole = null;
  let currentUser = null;
  let project = null;
  let items = [];
  let complaints = [];
  let activeTab = params.get('tab') || 'overview';

  // Items dropped in a later revision are flagged `removed` rather than
  // deleted (see the listing tool's push logic) — kept for the audit trail
  // but excluded everywhere active work, counts, and readiness are shown.
  function activeItems() { return items.filter(i => !i.removed); }
  function removedItems() { return items.filter(i => i.removed); }

  // ── AUTH ──────────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;
    const data = await resolveUserDoc(user, 'floor');
    currentRole = data.role || 'floor'; // default to floor not sales to avoid wrong redirects
    const name = data.name || user.email.split('@')[0];
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-role').textContent = currentRole;
    document.getElementById('user-avatar').textContent = name.substring(0,2).toUpperCase();
    if (currentRole === 'admin') {
      document.getElementById('nav-admin-section').style.display = 'block';
      document.getElementById('nav-admin').style.display = 'flex';
      const bnA = document.getElementById('bn-admin');
      if (bnA) bnA.style.display = 'flex';
    }
    loadProject();
  });

  // ── LOAD PROJECT ──────────────────────────────────────────────────────────
  async function loadProject() {
    try {
      const [projSnap, itemsSnap, complSnap] = await Promise.all([
        getDoc(doc(db, 'projects', projectId)),
        getDocs(collection(db, 'projects', projectId, 'items')),
        getDocs(query(collection(db, 'complaints'), where('projectId', '==', projectId))),
      ]);

      if (!projSnap.exists()) { window.location.href = 'dashboard.html'; return; }

      project = { id: projSnap.id, ...projSnap.data() };
      items = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => { const na=parseInt(a.productNo)||0, nb=parseInt(b.productNo)||0; return na!==nb ? na-nb : (a.name||'').localeCompare(b.name||''); });
      complaints = complSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      // Keep the public share mirror current every time a project is opened —
      // this backfills projects that existed before syncPublicShare did.
      syncPublicShare(projectId);

      // Sales staff: only see their assigned projects
      // Only redirect if role is explicitly 'sales' (not default fallback)
      if (currentRole === 'sales' && currentUser) {
        const userData2 = (await getDoc(doc(db, 'users', currentUser.uid))).data() || {};
        if (userData2.role === 'sales') {
          const userName = document.getElementById('user-name').textContent;
          const isAssigned = project.assigneeUid === currentUser.uid ||
            project.assignee === userName ||
            !project.assignee;
          if (!isAssigned) {
            window.location.href = 'dashboard.html';
            return;
          }
        }
      }

      document.getElementById('topbar-name').textContent = project.projectName || '—';
      document.title = `${project.projectName || 'Project'} — Lyffin Ops`;

      renderTopbarActions();
      renderContent();
      document.getElementById('page-loading').style.display = 'none';
    } catch(e) {
      console.error(e);
      showToast('Error loading project');
      document.getElementById('page-loading').style.display = 'none';
    }
  }

  function renderTopbarActions() {
    const canEdit = ['admin','sales','design','supervisor'].includes(currentRole);
    const canDeliver = ['admin','supervisor'].includes(currentRole);
    const isReady = project.status === 'Packing' || project.status === 'Ready';
    const isDelivered = project.status === 'Delivered' || project.status === 'Completed';

    let html = '';
    if (currentRole === 'admin') {
      html += `<button class="btn btn-danger" onclick="deleteProject()" style="margin-right:4px">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 10h8l1-10"/></svg>
        Delete
      </button>`;
    }
    // Share link — visible to sales, admin, supervisor
    if (['admin','sales','supervisor'].includes(currentRole)) {
      html += `<button class="btn btn-ghost" onclick="copyShareLink()" title="Copy shareable client link">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 2l4 4-4 4"/><path d="M14 6H6a4 4 0 000 8h1"/></svg>
        Share
      </button>`;
    }
    if (canEdit) {
      html += `<button class="btn btn-ghost" onclick="switchTab('edit', document.querySelectorAll('.tab')[2])">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M11 2l3 3-8 8H3v-3L11 2z"/></svg>
        Edit
      </button>`;
    }
    if (canDeliver && isReady && !isDelivered) {
      html += `<button class="btn btn-primary" onclick="openDeliveryModal()" style="background:#16a34a;border-color:#16a34a">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 8l4 4 8-8"/></svg>
        Mark delivered
      </button>`;
    }
    if (canDeliver && project.status === 'Delivered') {
      // Already delivered — everything the full form captures (date,
      // delivered-by, notes, checklist) was recorded then. Moving on to
      // Completed doesn't need any of that re-entered.
      html += `<button class="btn btn-primary" onclick="markCompleted()" style="background:#16a34a;border-color:#16a34a">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 8l4 4 8-8"/></svg>
        Mark Completed
      </button>`;
    }
    if (isDelivered) {
      html += `<span style="font-size:13px;color:#16a34a;font-weight:500;display:flex;align-items:center;gap:5px">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" style="width:14px;height:14px"><path d="M2 8l4 4 8-8"/></svg>
        ${esc(project.status)} ${project.deliveredDate ? '· ' + formatDate(project.deliveredDate) : ''}
      </span>`;
    }
    document.getElementById('topbar-actions').innerHTML = html;
  }

  // ── RENDER ALL ────────────────────────────────────────────────────────────
  function renderContent() {
    const statusClass = 'badge-' + (project.status || 'not-started').toLowerCase().replace(/[^a-z0-9]+/g,'-');
    const content = document.getElementById('main-content');

    content.innerHTML = `
      <!-- Project header -->
      <div class="project-header-card">
        <div class="project-header-top">
          <div>
            <div class="project-title">${esc(project.projectName || '—')}</div>
            <div class="project-order">Order #${esc(project.orderNo || '—')} · Created ${formatDate(project.orderDate)}</div>
          </div>
          <span class="badge ${statusClass}">${project.status || 'Not started'}</span>
        </div>
        <div class="project-meta-grid">
          <div class="meta-item"><label>Location</label><span>${esc(project.location || '—')}</span></div>
        ${project.address ? `<div class="meta-item" style="grid-column:1/-1"><label>Address</label><span style="white-space:pre-line">${esc(project.address)}</span></div>` : ''}
        ${project.coordinates ? `<div class="meta-item"><label>Coordinates</label><span>${project.coordinates.startsWith('http') ? `<a href="${esc(project.coordinates)}" target="_blank" style="color:var(--gold);text-decoration:none">Open in Maps ↗</a>` : esc(project.coordinates)}</span></div>` : ''}
          <div class="meta-item"><label>Assignee</label><span>${esc(project.assignee || '—')}</span></div>
          <div class="meta-item"><label>Order date</label><span>${formatDate(project.orderDate)}</span></div>
          <div class="meta-item"><label>Handover</label><span>${formatDate(project.handoverDate)}</span></div>
          <div class="meta-item"><label>Contact</label><span>${esc(project.contactNo || '—')}</span></div>
          <div class="meta-item"><label>Fabric</label><span>${esc(project.fabricStatus || 'Not selected')}</span></div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs" id="tabs-container">
        <div class="tab${activeTab==='overview'?' active':''}" onclick="switchTab('overview', this)">Overview</div>
        <div class="tab${activeTab==='items'?' active':''}" onclick="switchTab('items', this)">Production items (${activeItems().length})</div>
        <div class="tab${activeTab==='edit'?' active':''}" onclick="switchTab('edit', this)">Edit project</div>
        <div class="tab${activeTab==='complaints'?' active':''}" onclick="switchTab('complaints', this)">Complaints (${complaints.length})</div>
        <div class="tab${activeTab==='notes'?' active':''}" onclick="switchTab('notes', this)">Notes</div>
        <div class="tab${activeTab==='followups'?' active':''}" onclick="switchTab('followups', this)">Follow-ups</div>
        <div class="tab${activeTab==='activity'?' active':''}" onclick="switchTab('activity', this)">Activity log</div>
      </div>

      <!-- Tab content -->
      <div id="tab-content"></div>
    `;

    renderTab(activeTab);
  }

  async function loadEditAssignees() {
    const sel = document.getElementById('e-assignee');
    if (!sel) return;
    sel.innerHTML = '<option value="">Loading...</option>';
    try {
      const snap = await getDocs(collection(db, 'users'));
      const users = snap.docs.map(d => d.data()).filter(u => !u.pending && u.name);
      if (!users.length) {
        sel.innerHTML = '<option value="">No team members found</option>';
        return;
      }
      sel.innerHTML = '<option value="">Select assignee...</option>' +
        users.map(u => '<option ' + (project.assignee === (u.name||u.email) ? 'selected' : '') + '>' + (u.name||u.email) + '</option>').join('');
    } catch(e) {
      console.error('loadEditAssignees error:', e);
      sel.innerHTML = '<option value="">Error loading</option>';
    }
  }

  window.switchTab = function(tab, el) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    renderTab(tab);
  };

  function renderTab(tab) {
    const el = document.getElementById('tab-content');
    if (tab === 'overview')    el.innerHTML = renderOverview();
    if (tab === 'items')       el.innerHTML = renderItems();
    if (tab === 'edit')        { el.innerHTML = renderEdit(); loadEditAssignees(); }
    if (tab === 'complaints')  el.innerHTML = renderComplaints();
    if (tab === 'notes')       el.innerHTML = renderNotes();
    if (tab === 'followups')   { el.innerHTML = '<div class="empty-small">Loading…</div>'; loadFollowups(); }
    if (tab === 'supervisor')  el.innerHTML = renderSupervisor();
    if (tab === 'activity')    { el.innerHTML = '<div class="section-card"><div class="section-header"><div class="section-title">Activity log</div></div><div id="activity-list" style="padding:0"><div class="empty-small">Loading…</div></div></div>'; loadActivityLog(); }
  }

  // ── OVERVIEW TAB ──────────────────────────────────────────────────────────
  function renderOverview() {
    const totalItems = activeItems().length;
    const readyItems = activeItems().filter(i => i.overallStatus === 'Ready').length;
    const openComplaints = complaints.filter(c => c.status !== 'Resolved').length;
    const pct = totalItems ? Math.round(readyItems / totalItems * 100) : 0;

    return `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px">
        <div class="section-card" style="padding:18px 20px">
          <div style="font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Items in production</div>
          <div style="font-size:28px;font-weight:500">${totalItems}</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:3px">${readyItems} ready · ${totalItems - readyItems} pending</div>
        </div>
        <div class="section-card" style="padding:18px 20px">
          <div style="font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Progress</div>
          <div style="font-size:28px;font-weight:500">${pct}%</div>
          <div style="height:4px;background:var(--surface-2);border-radius:2px;margin-top:8px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--gold);border-radius:2px;transition:width .4s"></div></div>
        </div>
        <div class="section-card" style="padding:18px 20px">
          <div style="font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Open complaints</div>
          <div style="font-size:28px;font-weight:500;color:${openComplaints > 0 ? '#c0392b' : 'var(--ink)'}">${openComplaints}</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:3px">${complaints.length} total logged</div>
        </div>
      </div>

      ${project.notes ? `
      <div class="section-card">
        <div class="section-header"><div class="section-title">Notes</div></div>
        <div style="padding:16px 20px;font-size:13.5px;color:var(--ink-2);line-height:1.6">${esc(project.notes)}</div>
      </div>` : ''}
      <div class="section-card" style="border:1px dashed var(--border)">
        <div style="padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div>
            <div style="font-size:13px;font-weight:500;color:var(--ink)">Client status page</div>
            <div style="font-size:12px;color:var(--ink-3);margin-top:2px">Read-only link you can share with the client — no login needed. Expires automatically after ${SHARE_LINK_DAYS} days.</div>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0">
            ${['admin','sales','supervisor'].includes(currentRole) ? `<button class="btn btn-ghost" onclick="revokeShareLink()" title="Invalidate the old link and generate a new one" style="color:#a83c2e">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" style="width:14px;height:14px"><path d="M2 8a6 6 0 1010-4.5M2 8V3M2 8h5"/></svg>
              Revoke &amp; regenerate
            </button>` : ''}
            <button class="btn btn-ghost" onclick="copyShareLink()" style="flex-shrink:0">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" style="width:14px;height:14px"><path d="M10 2l4 4-4 4"/><path d="M14 6H6a4 4 0 000 8h1"/></svg>
            Copy link
          </button>
        </div>
      </div>
    `;
  }

  // ── ITEMS TAB ─────────────────────────────────────────────────────────────
  function renderItems() {
    const active = activeItems();
    const removed = removedItems();
    if (!active.length && !removed.length) return `<div class="section-card"><div class="empty-small">No items pushed from Factory Listing Tool yet.</div></div>`;

    const STAGES = ['carpentry','polish','upholstery','packing'];
    const LABELS = { carpentry:'Structure', polish:'Polish', upholstery:'Upholstery', packing:'Packing' };

    const deliveredCount = active.filter(i => i.delivered).length;
    const deliverySummary = active.length ? `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)">
        <div style="font-size:12.5px;color:var(--ink-2)">${deliveredCount} of ${active.length} items delivered${deliveredCount>0 && deliveredCount<active.length ? ' — partial delivery' : ''}</div>
        ${deliveredCount<active.length ? `<button class="btn btn-ghost" style="font-size:12px;padding:5px 10px" onclick="markAllItemsDelivered()">Mark all delivered</button>` : ''}
      </div>` : '';

    const activeTableHtml = !active.length ? `<div class="empty-small">No active items — see removed items below.</div>` : `
        ${deliverySummary}
        <table>
          <thead><tr>
            <th>#</th>
            <th>Product</th>
            <th>Qty</th>
            <th>Area</th>
            <th>Dimensions</th>
            <th>Structure</th>
            <th>Polish</th>
            <th>Upholstery</th>
            <th>Packing</th>
            <th>Status</th>
            <th title="Has this specific item physically left the factory yet? Independent of the project's own status — lets you track a partial delivery.">Delivered</th>
          </tr></thead>
          <tbody>${active.map((item, i) => {
            const _ovs2 = item.overallStatus || 'Structure';
            const statusClass = _ovs2.includes('(In Progress)')
              ? 'badge-' + _ovs2.replace(' (In Progress)','').toLowerCase() + '-inprogress'
              : 'badge-' + _ovs2.toLowerCase().replace(/[^a-z0-9]+/g,'-');
            const statusCellHtml = item.onHold
              ? `<span class="badge" style="font-size:11px;background:#fef3c7;color:#92400e">⏸ On Hold</span>${item.holdReason?`<div style="font-size:11px;color:var(--ink-3);margin-top:2px">${esc(item.holdReason)}</div>`:''}`
              : `<span class="badge ${statusClass}" style="font-size:11px">${esc((item.overallStatus||'Structure').replace(' (In Progress)',' ▶'))}</span>`;
            return `<tr${item.onHold?' style="background:#fffbeb"':''}>
              <td style="color:var(--ink-3);font-size:12px">${esc(item.productNo || (i+1))}</td>
              <td><div style="display:flex;align-items:center;gap:8px">${item.thumbnail ? `<img src="${item.thumbnail}" style="width:32px;height:32px;object-fit:cover;border-radius:5px;border:1px solid var(--border);flex-shrink:0" alt="">` : ''}<strong>${esc(item.name||'—')}</strong></div></td>
              <td>${item.qty||1}</td>
              <td style="font-size:12px;color:var(--ink-3)">${esc(item.area||'—')}</td>
              <td style="font-size:12px;color:var(--ink-3)">${esc(item.dimensions||'—')}${item.details?`<br/><span style="font-style:italic;font-size:11px">${esc(item.details)}</span>`:""}${(item.finishes&&item.finishes.filter(Boolean).length)?`<br/><span style="font-size:11px">Finish: ${item.finishes.filter(Boolean).map(esc).join(', ')}</span>`:""}${(item.upholstery&&item.upholstery.filter(Boolean).length)?`<br/><span style="font-size:11px">Upholstery: ${item.upholstery.filter(Boolean).map(esc).join(', ')}</span>`:""}</td>
${(function(){
                return STAGES.map(function(s){
                  const st = item[s+'Status'];
                  const lbl = LABELS[s];
                  if(st==='na') return '<td><span class="stage-pill sp-na">N/A</span></td>';
                  if(st==='done') return '<td><span class="stage-pill sp-done">'+lbl+'</span></td>';
                  return '<td><span class="stage-pill sp-pending">'+lbl+'</span></td>';
                }).join('');
              })()}
              <td>${statusCellHtml}</td>
              <td style="text-align:center"><input type="checkbox" ${item.delivered?'checked':''} onchange="toggleItemDelivered('${item.id}', this.checked)" style="width:16px;height:16px;cursor:pointer" title="Mark this item as physically delivered"></td>
            </tr>`;
          }).join('')}</tbody>
        </table>`;

    const removedHtml = removed.length ? `
      <div class="section-card" style="margin-top:16px">
        <div class="section-header"><div class="section-title">Removed items (${removed.length})</div></div>
        <div class="empty-small" style="text-align:left;padding:8px 20px 4px;color:var(--ink-3)">Dropped in a later revision from the Factory Listing Tool. Kept here for reference only — not counted in production.</div>
        <table>
          <tbody>${removed.map(item => `<tr style="opacity:.6">
              <td style="width:36px;color:var(--ink-3);font-size:12px">${esc(item.productNo||'')}</td>
              <td><strong style="text-decoration:line-through">${esc(item.name||'—')}</strong></td>
              <td style="font-size:11px;color:var(--ink-3)">Removed ${item.removedAt && item.removedAt.toDate ? item.removedAt.toDate().toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) : ''}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>` : '';

    return `
      <div class="section-card">${activeTableHtml}</div>${removedHtml}`;
  }

  // ── EDIT TAB ──────────────────────────────────────────────────────────────
  function renderEdit() {
    const canEdit = ['admin','sales','design','supervisor'].includes(currentRole);
    if (!canEdit) return `<div class="section-card"><div class="empty-small">You don't have permission to edit projects.</div></div>`;

    return `
      <div class="section-card">
        <div class="section-header"><div class="section-title">Edit project details</div></div>
        <div class="edit-grid">
          <div class="form-field">
            <label>Project name</label>
            <input type="text" id="e-name" value="${esc(project.projectName||'')}">
          </div>
          <div class="form-field">

  window.saveEdit = async function() {
    const btn = document.getElementById('btn-save-edit');

    const name = document.getElementById('e-name').value.trim();
    const orderDate = document.getElementById('e-order-date').value;
    const handoverDate = document.getElementById('e-handover').value;
    const contactNo = document.getElementById('e-contact').value.trim();
    const newStatus = document.getElementById('e-status').value;
    const oldStatus = project.status || 'Not Started';

    // ── Validation ──────────────────────────────────────────────────────
    if (!name) { showToast('Project name is required'); return; }
    if (orderDate && handoverDate && handoverDate < orderDate) {
      showToast('Handover date can\'t be before the order date'); return;
    }
    if (contactNo && !/^[\d\s+()-]{7,15}$/.test(contactNo)) {
      showToast('Contact number looks invalid — digits only, 7–15 characters'); return;
    }

    // ── Status workflow guards ─────────────────────────────────────────
    if (newStatus !== oldStatus) {
      const unfinished = activeItems().filter(i => i.overallStatus !== 'Ready');
      if ((newStatus === 'Delivered' || newStatus === 'Completed') && unfinished.length) {
        alert('Can\'t mark this ' + newStatus + ' — ' + unfinished.length + ' item(s) are not yet Ready:\n' +
          unfinished.slice(0, 8).map(i => '• ' + (i.name || 'item') + (i.onHold ? '  [ON HOLD' + (i.holdReason ? ': ' + i.holdReason : '') + ']' : '')).join('\n') +
          (unfinished.length > 8 ? '\n…and ' + (unfinished.length - 8) + ' more' : '') +
          '\n\nUse the Delivery checklist once every item is ready, or update items in Factory first.');
        return;
      }
      if (!isValidTransition(oldStatus, newStatus)) {
        const ok = confirm('That skips from "' + oldStatus + '" straight to "' + newStatus + '" — the normal order is ' +
          STATUS_ORDER.join(' → ') + '.\n\nSave anyway?');
        if (!ok) return;
      }
    }

    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
      const oldHandover = project.handoverDate || '';
      const oldOrderDate = project.orderDate || '';
      const updates = {
        projectName:    name,
        orderNo:        document.getElementById('e-order').value.trim(),
        orderDate:      orderDate,
        location:       document.getElementById('e-location').value.trim(),
        address:        document.getElementById('e-address').value.trim(),
        coordinates:    document.getElementById('e-coords').value.trim(),
        handoverDate:   handoverDate,
        assignee:       document.getElementById('e-assignee').value,
        status:         newStatus,
        contactNo:      contactNo,
        fabricStatus:   document.getElementById('e-fabric').value,
        deliveryStatus: document.getElementById('e-delivery').value,
        updatedAt:      serverTimestamp(),
      };
      await updateDoc(doc(db, 'projects', projectId), updates);
      await syncPublicShare(projectId);
      // Log handover date change
      if (updates.handoverDate && updates.handoverDate !== oldHandover) {
        const userName = document.getElementById('user-name').textContent;
        await logProjectActivity('Handover date changed from ' + (oldHandover || 'none') + ' to ' + updates.handoverDate + ' by ' + userName);
        // Store in dateHistory subcollection
        await addDoc(collection(db, 'projects', projectId, 'dateHistory'), {
          oldDate: oldHandover,
          newDate: updates.handoverDate,
          changedBy: userName,
          changedAt: serverTimestamp()
        });
      }
      // Log order date change (drives the production schedule)
      if (updates.orderDate !== oldOrderDate) {
        const uName = document.getElementById('user-name').textContent;
        await logProjectActivity('Order date changed from ' + (oldOrderDate || 'none') + ' to ' + (updates.orderDate || 'none') + ' by ' + uName);
      }
      // Log status and assignee changes specifically, so the audit trail
      // shows exactly what moved and to what — not just "details updated".
      const userName = document.getElementById('user-name').textContent;
      if (updates.status !== oldStatus) {
        await logProjectActivity('Status changed from ' + oldStatus + ' to ' + updates.status + ' by ' + userName);
      }
      if (updates.assignee !== (project.assignee || '')) {
        await logProjectActivity('Assignee changed from ' + (project.assignee || 'none') + ' to ' + (updates.assignee || 'none') + ' by ' + userName);
      }
      // Log general edit activity
      await logProjectActivity(userName + ' updated project details');
      Object.assign(project, updates);
      showToast('Project updated');
      renderContent();
    } catch(e) {
      showToast('Save failed: ' + e.message);
      alert('The save did not go through:\n\n' + e.message + '\n\nYour changes are still in the form — please try again.');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Save changes'; }
    }
  };

  // ── SUPERVISOR TAB ───────────────────────────────────────────────────────────
  function renderSupervisor() {
    const STAGES = ['carpentry','polish','upholstery','packing'];
    const LABELS = {carpentry:'Structure',polish:'Polish',upholstery:'Upholstery',packing:'Packing'};
    const COLORS = {carpentry:'#d97706',polish:'#3b82f6',upholstery:'#0ea5e9',packing:'#10b981'};

    if (!activeItems().length) return '<div class="section-card"><div class="empty-small">No items pushed yet.</div></div>';

    // Stage summary
    const stageSummary = STAGES.map(stage => {
      const valid = activeItems().filter(i => i[stage + 'Status'] !== 'na');
      const done = valid.filter(i => i[stage + 'Status'] === 'done').length;
      return {stage, label: LABELS[stage], total: valid.length, done, color: COLORS[stage]};
    });

    const summaryHtml = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">' +
      stageSummary.map(s => {
        const pct = s.total ? Math.round(s.done / s.total * 100) : 0;
        return '<div class="section-card" style="padding:14px 16px">' +
          '<div style="font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">' + s.label + '</div>' +
          '<div style="font-size:22px;font-weight:500;color:' + s.color + '">' + s.done + '/' + s.total + '</div>' +
          '<div style="height:3px;background:var(--surface-2);border-radius:2px;margin-top:8px;overflow:hidden">' +
            '<div style="height:100%;width:' + pct + '%;background:' + s.color + ';border-radius:2px"></div>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';

    // Items checklist
    const itemRows = activeItems().map(item => {
      const validStages = STAGES.filter(s => item[s + 'Status'] !== 'na');
      const stagePills = validStages.map(stage => {
        const done = item[stage + 'Status'] === 'done';
        const color = done ? COLORS[stage] : 'var(--border)';
        const textColor = done ? 'white' : 'var(--ink-3)';
        return '<span style="display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:500;background:' + color + ';color:' + textColor + '">' +
          (done ? '&#10003; ' : '') + LABELS[stage] + '</span>';
      }).join('');
      const isReady = item.overallStatus === 'Ready';
      const rowBg = item.onHold ? '#fffbeb' : (isReady ? '#f0fdf4' : 'transparent');
      const statusHtml = item.onHold
        ? '<span style="color:#92400e;font-weight:500;font-size:12px">⏸ On hold' + (item.holdReason ? '<br><span style="font-weight:400;font-size:11px">' + esc(item.holdReason) + '</span>' : '') + '</span>'
        : (isReady ? '<span style="color:#16a34a;font-weight:500;font-size:13px">&#10003; Ready</span>' : '<span style="color:var(--ink-3);font-size:12px">In progress</span>');
      return '<tr style="background:' + rowBg + '">' +
        '<td style="padding:10px 16px;font-weight:500"><div style="display:flex;align-items:center;gap:8px">' + (item.thumbnail ? '<img src="' + item.thumbnail + '" style="width:30px;height:30px;object-fit:cover;border-radius:5px;border:1px solid var(--border);flex-shrink:0" alt="">' : '') + '<span>' + (item.productNo ? '<span style="color:var(--ink-3);font-weight:400">#' + esc(item.productNo) + '</span> ' : '') + esc(item.name||'—') + '</span></div></td>' +
        '<td style="padding:10px 16px;font-size:12px;color:var(--ink-3)">Qty: ' + (item.qty||1) + (item.area ? ' · ' + esc(item.area) : '') + (item.details ? '<br><span style="font-style:italic">' + esc(item.details) + '</span>' : '') +
        ((item.finishes && item.finishes.filter(Boolean).length) ? '<br>Finish: ' + item.finishes.filter(Boolean).map(esc).join(', ') : '') +
        ((item.upholstery && item.upholstery.filter(Boolean).length) ? '<br>Upholstery: ' + item.upholstery.filter(Boolean).map(esc).join(', ') : '') + '</td>' +
        '<td style="padding:10px 16px"><div style="display:flex;gap:4px;flex-wrap:wrap">' + stagePills + '</div></td>' +
        '<td style="padding:10px 16px;text-align:center">' + statusHtml + '</td>' +
      '</tr>';
    }).join('');

    return summaryHtml +
      '<div class="section-card">' +
        '<div class="section-header"><div class="section-title">Item checklist</div></div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:13.5px">' +
          '<thead><tr style="background:var(--surface);border-bottom:1px solid var(--border)">' +
            '<th style="padding:9px 16px;text-align:left;font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em">Product</th>' +
            '<th style="padding:9px 16px;text-align:left;font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em">Details</th>' +
            '<th style="padding:9px 16px;text-align:left;font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em">Stages</th>' +
            '<th style="padding:9px 16px;text-align:center;font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em">Status</th>' +
          '</tr></thead>' +
          '<tbody>' + itemRows + '</tbody>' +
        '</table>' +
      '</div>';
  }
